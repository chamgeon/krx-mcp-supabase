<!doctype html>
<!--
  OAuth consent page for the MCP server (Supabase Auth is the OAuth 2.1 authorization server).

  Flow: an MCP client (ChatGPT / Claude) sends the user to Supabase's /oauth/authorize, which redirects here with
  ?authorization_id=…  This page signs the user in (Kakao / Google), shows which app is asking, and approves or
  denies; supabase-js then redirects back to the client with an authorization code.

  Must be served at <Site URL> + <Authorization path> as set in Supabase → Authentication → OAuth Server, and
  this page's URL must be in Authentication → URL Configuration → Redirect URLs (for the social-login round trip).
-->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>KR Stock MCP 로그인</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #5c6370; --line: #e3e6eb; --accent: #2457d6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111317; --card: #1a1d23; --text: #eceef2; --muted: #9aa1ad; --line: #2b2f37; --accent: #6d95ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text);
           font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line);
            border-radius: 14px; padding: 28px 24px; }
    h1 { font-size: 19px; margin: 0 0 6px; }
    p { margin: 0 0 16px; color: var(--muted); }
    .who { color: var(--text); font-weight: 600; }
    button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); font: inherit;
             font-weight: 600; cursor: pointer; margin-top: 10px; background: var(--card); color: var(--text); }
    button:disabled { opacity: .6; cursor: default; }
    .kakao { background: #fee500; border-color: #fee500; color: #191919; }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .link { background: none; border: none; color: var(--muted); font-weight: 400; font-size: 13px; padding: 6px; }
    .scopes { margin: 0 0 16px; padding-left: 18px; color: var(--muted); }
    .error { color: #d03b3b; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <section id="loading"><p>불러오는 중…</p></section>

    <section id="login" hidden>
      <h1>로그인</h1>
      <p>KR Stock MCP를 쓰려면 로그인해 주세요.</p>
      <button class="kakao" data-provider="kakao">카카오로 계속하기</button>
      <button data-provider="google">Google로 계속하기</button>
    </section>

    <section id="consent" hidden>
      <h1><span id="client-name" class="who"></span> 연결</h1>
      <p><span id="client-name-2" class="who"></span>이(가) <span id="user-email" class="who"></span> 계정으로
        KR Stock MCP의 주가·스크리닝 데이터를 조회하려고 합니다.</p>
      <ul id="scopes" class="scopes"></ul>
      <button id="approve" class="primary">허용</button>
      <button id="deny">거부</button>
      <button id="switch" class="link">다른 계정으로 로그인</button>
    </section>

    <section id="failed" hidden>
      <h1>문제가 생겼어요</h1>
      <p id="error-text" class="error"></p>
      <p>ChatGPT / Claude에서 커넥터 연결을 다시 시도해 주세요.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://rtwqklwmvvgtzqjsdhna.supabase.co'
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_uTYbVpdVVyO191eWAlo2Ug_G05fFPBS'

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true },
    })
    const params = new URLSearchParams(location.search)
    const authorizationId = params.get('authorization_id')
    const $ = (id) => document.getElementById(id)

    function show(id) {
      for (const s of ['loading', 'login', 'consent', 'failed']) $(s).hidden = s !== id
    }
    function fail(msg) {
      $('error-text').textContent = msg
      show('failed')
    }
    // This page's URL with only authorization_id kept (drops the ?code= from the social-login return)
    function selfUrl() {
      const u = new URL(location.href)
      u.search = ''
      u.searchParams.set('authorization_id', authorizationId)
      return u.toString()
    }

    async function main() {
      if (!authorizationId) return fail('authorization_id가 없습니다. 이 페이지는 ChatGPT / Claude에서 연결할 때 열립니다.')

      // detectSessionInUrl exchanges ?code= from the social-login return; wait for it before reading the session
      await sb.auth.initialize?.()
      const { data: { session } } = await sb.auth.getSession()
      if (params.has('code')) history.replaceState(null, '', selfUrl())

      if (!session) {
        show('login')
        return
      }

      const { data, error } = await sb.auth.oauth.getAuthorizationDetails(authorizationId)
      if (error) return fail(error.message)
      if (!('authorization_id' in data)) {
        location.href = data.redirect_url // already approved before
        return
      }

      const name = data.client?.name || '외부 앱'
      $('client-name').textContent = name
      $('client-name-2').textContent = name
      $('user-email').textContent = data.user?.email || session.user.email || '내'
      const scopes = (data.scope || '').split(' ').filter(Boolean)
      $('scopes').innerHTML = ''
      for (const s of scopes) {
        const li = document.createElement('li')
        li.textContent = s
        $('scopes').appendChild(li)
      }
      $('scopes').hidden = scopes.length === 0
      show('consent')
    }

    for (const btn of document.querySelectorAll('[data-provider]')) {
      btn.addEventListener('click', async () => {
        btn.disabled = true
        const { error } = await sb.auth.signInWithOAuth({
          provider: btn.dataset.provider,
          options: { redirectTo: selfUrl() },
        })
        if (error) { btn.disabled = false; fail(error.message) }
      })
    }

    async function decide(approve) {
      $('approve').disabled = $('deny').disabled = true
      const fn = approve ? sb.auth.oauth.approveAuthorization : sb.auth.oauth.denyAuthorization
      const { data, error } = await fn.call(sb.auth.oauth, authorizationId, { skipBrowserRedirect: true })
      if (error) return fail(error.message)
      location.href = data.redirect_url
    }
    $('approve').addEventListener('click', () => decide(true))
    $('deny').addEventListener('click', () => decide(false))
    $('switch').addEventListener('click', async () => {
      await sb.auth.signOut()
      show('login')
    })

    main().catch((e) => fail(String(e?.message || e)))
  </script>
</body>
</html>
