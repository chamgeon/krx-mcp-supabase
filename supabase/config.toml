# All functions do their own auth, so the gateway JWT check is off. mcp verifies OAuth access tokens itself (and must
# answer unauthenticated requests with the 401 that starts the login), the ingest jobs check a secret header.
[functions.mcp]
verify_jwt = false

[functions.krx-ingest]
verify_jwt = false

[functions.kis-ingest]
verify_jwt = false

[functions.telegram-ingest]
verify_jwt = false
